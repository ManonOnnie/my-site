<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>momo.일본어 교실 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --white: #ffffff;
    --ink: #2a1812;
    --ink-85: rgba(42,24,18,0.85);
    --ink-60: rgba(42,24,18,0.6);
    --ink-45: rgba(42,24,18,0.45);
    --ink-25: rgba(42,24,18,0.25);
    --ink-12: rgba(42,24,18,0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
    font-weight: 300;
    padding: 40px 20px 70px;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Noto Serif KR', serif; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1, h2 { margin: 0; font-weight: 400; }
  .eng {
    display: block; font-family: 'Playfair Display', 'Cormorant Garamond', serif;
    font-size: 26px; letter-spacing: 1px; color: var(--ink); line-height: 1.15;
  }
  .jp-sub {
    display: block; font-family: 'Noto Serif KR', serif; font-weight: 400;
    font-size: 12.5px; color: var(--ink-60); letter-spacing: 3px; margin-top: 6px;
  }
  .eyebrow {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px;
    color: var(--ink-45); letter-spacing: 2px; margin-bottom: 4px;
  }
  .card {
    padding: 20px 0 22px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--ink-12);
  }
  .section-label {
    margin: 44px 0 18px;
  }
  .field { margin-bottom: 20px; }
  .field-label {
    font-size: 11px; color: var(--ink-45); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 400;
  }
  input, select {
    width: 100%; box-sizing: border-box; border: none; border-bottom: 1px solid var(--ink-25);
    background: var(--white); padding: 13px 10px; font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif; color: var(--ink); border-radius: 0;
    -webkit-appearance: none; appearance: none;
  }
  input:focus, select:focus { outline: none; border-bottom-color: var(--ink); }
  .row2 { display: flex; gap: 10px; }
  .row2 > * { flex: 1; }
  .btn {
    display: inline-block; background: var(--ink); color: #fff; border: 1px solid var(--ink);
    padding: 13px 22px; font-size: 12.5px; font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; letter-spacing: 1.5px; border-radius: 0; transition: all 0.15s ease;
  }
  .btn:hover { background: var(--white); color: var(--ink); }
  .btn:disabled { background: var(--ink-25); border-color: var(--ink-25); color: #fff; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink-25); }
  .btn.ghost:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.brass { background: var(--white); color: var(--ink); border: 1px solid var(--ink); }
  .btn.brass:hover { background: var(--ink); color: #fff; }
  .btn.rust { background: var(--white); color: var(--ink); border: 1px solid var(--ink-60); }
  .btn.rust:hover { background: var(--ink); color: #fff; }
  .btn.sm { font-size: 11px; padding: 9px 14px; letter-spacing: 1px; }
  .tabs { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 30px; border-bottom: 1px solid var(--ink-12); }
  .tab {
    padding: 10px 16px 12px; font-size: 12px; letter-spacing: 1px; border: none;
    background: transparent; color: var(--ink-45); cursor: pointer; font-family: inherit;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .stamp {
    display: inline-block; border: 1px solid var(--ink-45); color: var(--ink-60);
    font-family: 'Noto Serif KR', serif; font-size: 10.5px; padding: 2px 8px;
    letter-spacing: 1px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    padding: 10px 14px; font-size: 13px; cursor: pointer; font-family: inherit;
    border-radius: 0; transition: all 0.15s ease;
  }
  .chip:hover { background: var(--white); color: var(--ink); }
  .chip.open-admin { background: var(--white); color: var(--ink); border-color: var(--ink-25); cursor: pointer; }
  .chip.open-admin:hover { background: var(--ink); color: #fff; }
  .chip.closed { border: 1px solid var(--ink-12); color: var(--ink-25); opacity: 1; padding: 10px 14px; font-size: 12px; }
  .chip.booked { border: 1px solid var(--ink-25); color: var(--ink-45); padding: 8px 12px; font-size: 11.5px; }
  .muted { color: var(--ink-45); font-size: 13px; font-weight: 300; }
  .err { color: var(--ink); font-size: 12px; margin-bottom: 10px; border-bottom: 1px solid var(--ink); padding-bottom: 6px; display: inline-block; }
  a.link { color: var(--ink-60); font-size: 11px; border-bottom: 1px solid var(--ink-25); padding-bottom: 1px; text-decoration: none; letter-spacing: 0.5px; }
  .rowflex { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .loading { text-align: center; padding: 60px 0; color: var(--ink-45); font-size: 12px; letter-spacing: 1px; }
  .vrule { width: 1px; height: 28px; background: var(--ink-25); margin: 0 auto 14px; }

  /* editorial spine — thin vertical line + sideways small text, echoing a Taisho book spine */
  .spine { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
  .spine .spine-line { width: 1px; height: 34px; background: var(--ink-25); }
  .spine .spine-dot { width: 5px; height: 5px; border-radius: 50%; border: 1px solid var(--ink-25); margin-top: -2px; }
  .spine .spine-text {
    writing-mode: vertical-rl; font-family: 'Noto Serif KR', serif; font-size: 11px;
    letter-spacing: 4px; color: var(--ink-45);
  }

  /* small geometric lattice accent, a restrained nod to Taisho-era mon patterns */
  .lattice { display: block; margin: 40px auto 0; opacity: 0.5; }

  /* brand mark block — circular monogram + name, echoing a shop colophon */
  .brand-block { text-align: center; margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--ink-12); }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--ink-25);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
    font-family: 'Noto Serif KR', serif; font-size: 11px; line-height: 1.3; color: var(--ink-60);
  }
  .brand-name { font-family: 'Noto Serif KR', serif; font-size: 13px; letter-spacing: 2px; color: var(--ink); }
  .brand-eng {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 11px;
    color: var(--ink-45); letter-spacing: 2px; margin-top: 3px;
  }

  /* photo hero — full-bleed image with dark overlay + large editorial heading */
  .auto-photo { width: 100%; height: 100%; display: block; object-fit: cover; }
  .photo-hero { position: relative; width: 100%; height: 46vh; min-height: 300px; overflow: hidden; margin: -40px -20px 40px; width: calc(100% + 40px); }
  .photo-hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,14,10,0.15) 0%, rgba(20,14,10,0.75) 100%);
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 26px 24px 30px;
  }
  .photo-hero-eyebrow {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px;
    color: rgba(252,251,249,0.75); letter-spacing: 3px; margin-bottom: 8px;
  }
  .photo-hero-title {
    font-family: 'Playfair Display', serif; font-weight: 500;
    font-size: clamp(44px, 15vw, 68px); line-height: 0.95; color: #fcfbf9; letter-spacing: 0.5px;
  }
  .photo-hero-sub {
    font-family: 'Noto Serif KR', serif; font-size: 13px; color: rgba(252,251,249,0.8);
    letter-spacing: 2px; margin-top: 10px;
  }

  /* calendar day picker */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-wd { text-align: center; font-size: 11px; color: var(--ink-45); padding: 4px 0 8px; }
  .cal-cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    position: relative; font-size: 13px; color: var(--ink-25);
  }
  .cal-cell.empty { visibility: hidden; }
  .cal-cell.available { color: var(--ink); cursor: pointer; border: 1px solid var(--ink-12); }
  .cal-dot { position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); }

  /* time-grid modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,14,10,0.5); z-index: 200;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-box { background: #fcfbf9; border: 1px solid var(--ink-25); padding: 24px 20px; max-width: 340px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-title { font-family: 'Noto Serif KR', serif; font-size: 15px; margin-bottom: 16px; text-align: center; }
  .time-grid { width: 100%; border-collapse: collapse; }
  .time-grid td { padding: 3px; text-align: center; }
  .time-grid-hour { font-size: 12px; color: var(--ink-45); width: 32px; }
  .time-cell {
    width: 100%; border: 1px solid var(--ink-25); background: #fff; color: var(--ink);
    padding: 8px 2px; font-size: 12px; cursor: pointer; font-family: inherit; box-sizing: border-box;
  }
  .time-cell:disabled { color: var(--ink-25); cursor: not-allowed; }
  .time-cell.closed { display: inline-block; width: 100%; border: 1px solid var(--ink-12); color: var(--ink-25); padding: 8px 2px; font-size: 10px; box-sizing: border-box; }
</style>
</head>
<body>
<div class="wrap">
  <div class="photo-hero">
    <img class="auto-photo" id="heroPhoto" data-base="photo-booking-hero" alt="">
    <div class="photo-hero-overlay">
      <div class="photo-hero-eyebrow">RESERVATION</div>
      <div class="photo-hero-title">Reserve</div>
      <div class="photo-hero-sub">예약하기</div>
    </div>
  </div>
</div>
<div class="wrap" id="app"><div class="loading">読み込み中… / 로딩 중…</div></div>

<script>
/* ===================== 設定 ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbz1a8k6lfXoloi60qw_RkXa0i2PavWqtGExdmJiij7SMNQysLos--INIejpj7UO0wAI/exec';

/* ===================== 状態 ===================== */
let DATA = null;
let AUTHED = false;
let TAB = 'students';
let BUSY = false;
let MODAL_DATE = null;
let CAL_VIEW = null;
let CAL_DAY = null;
let MSG = '';

/* ===================== API ===================== */
async function apiGet() {
  const res = await fetch(API_URL);
  return res.json();
}
async function apiPost(action, payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
    body: JSON.stringify(Object.assign({ action }, payload || {})),
  });
  return res.json();
}

/* ===================== ユーティリティ ===================== */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function combineDateTime(dateStr, hh, mm) {
  if (!dateStr || hh === '' || hh === undefined || mm === '' || mm === undefined) return null;
  const d = new Date(`${dateStr}T00:00:00`);
  d.setHours(Number(hh), Number(mm), 0, 0);
  return d.toISOString();
}
function fmtKoDate(iso) {
  const d = new Date(iso);
  const days = ['일','월','화','수','목','금','토'];
  return `${d.getMonth()+1}월 ${d.getDate()}일(${days[d.getDay()]})`;
}
function fmtKoTime(iso) {
  const d = new Date(iso);
  let h = d.getHours();
  const ampm = h < 12 ? '오전' : '오후';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${ampm} ${h12}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtJaDate(iso) {
  const d = new Date(iso);
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
}
function fmtJaTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function deadlineFor(iso, daysBefore, hour) {
  const d = new Date(iso);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - daysBefore, hour, 0, 0, 0);
}
function gcalLink(iso, durationMin, title) {
  const start = new Date(iso);
  const end = new Date(start.getTime() + durationMin * 60000);
  const pad = (n) => String(n).padStart(2, '0');
  const fmt = (d) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const params = new URLSearchParams({ action: 'TEMPLATE', text: title, dates: `${fmt(start)}/${fmt(end)}`, ctz: 'Asia/Seoul' });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function hourOptions(from, to, includeExtra24) {
  let out = '';
  for (let h = from; h <= to; h++) out += `<option value="${h}">${String(h).padStart(2,'0')}時</option>`;
  if (includeExtra24) out += `<option value="24">24時</option>`;
  return out;
}
function minuteOptions() {
  return ['00','15','30','45'].map((m) => `<option value="${m}">${m}分</option>`).join('');
}

/* ===================== ブート ===================== */
async function boot() {
  try {
    const res = await apiGet();
    if (!res.ok) throw new Error(res.error || 'unknown');
    DATA = res.state;
    render();
  } catch (e) {
    document.getElementById('app').innerHTML = `
      <div class="card">
        <div>データを読み込めませんでした。</div>
        <div class="muted" style="margin-top:8px;font-size:11px;word-break:break-all;">詳細: ${esc(e.message || e)}</div>
        <button class="btn" style="margin-top:12px;" onclick="boot()">再試行</button>
      </div>`;
  }
}

/* ===================== ルーティング ===================== */
function render() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('student');
  if (token) renderStudentView(token);
  else renderAdmin();
}

/* ===================== 生徒側 ===================== */
function renderStudentView(token) {
  const app = document.getElementById('app');
  const student = DATA.students.find((s) => s.token === token);

  if (!student) {
    app.innerHTML = `<div class="card"><h2 class="serif">예약 링크를 찾을 수 없어요</h2><p class="muted">링크가 정확한지 확인해 주세요. 문제가 계속되면 선생님께 문의해 주세요.</p></div>`;
    return;
  }
  if (!student.active) {
    app.innerHTML = `<div class="card"><h2 class="serif">현재 이용할 수 없는 링크예요</h2><p class="muted">선생님께 문의해 주세요.</p></div>`;
    return;
  }

  const policy = DATA.policy;
  const now = new Date();
  const neededCount = student.duration === 30 ? 2 : 1;
  const slotByDatetime = {};
  DATA.slots.forEach((s) => { slotByDatetime[s.datetime] = s; });

  const bookableStarts = DATA.slots
    .filter((s) => s.status === 'open' && new Date(s.datetime) > now)
    .filter((s) => {
      if (neededCount === 1) return true;
      const nextIso = new Date(new Date(s.datetime).getTime() + 15*60000).toISOString();
      const next = slotByDatetime[nextIso];
      return next && next.status === 'open';
    })
    .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

  const myBookings = DATA.bookings
    .filter((b) => b.studentId === student.id && b.status === 'confirmed' && new Date(b.datetime) > now)
    .sort((a,b) => new Date(a.datetime) - new Date(b.datetime));

  let html = `
    <div class="card" style="text-align:center;">
      <div class="jp-sub" style="margin-top:2px;">${esc(student.name)}님의 예약</div>
      <div class="muted" style="margin-top:10px;">${student.duration}분 코스 · 잔여 <b style="color:var(--ink);">${student.balance}</b>회</div>
      ${(() => {
        const bd = student.balanceBreakdown || {};
        const now = new Date();
        const prevM = new Date(now.getFullYear(), now.getMonth()-1, 1).getMonth()+1;
        const curM = now.getMonth()+1;
        const nextM = new Date(now.getFullYear(), now.getMonth()+1, 1).getMonth()+1;
        return `<div style="font-size:11.5px;color:var(--ink-45);margin-top:8px;">
          ${prevM}월 이월분 ${bd.prev||0}회 · ${curM}월분 ${bd.current||0}회 · ${nextM}월분 ${bd.next||0}회
        </div>`;
      })()}
    </div>`;

  if (MSG) { html += `<div style="font-size:13px;color:var(--ink);margin-bottom:10px;">${esc(MSG)}</div>`; MSG = ''; }

  if (myBookings.length > 0) {
    html += `<div class="section-label"><span class="eng" style="font-size:19px;">UPCOMING</span><span class="jp-sub">예정된 레슨</span></div>`;
    myBookings.forEach((b) => {
      const cancellable = new Date() < deadlineFor(b.datetime, policy.cancelDaysBefore, policy.cancelCutoffHour);
      html += `
        <div class="card">
          <div class="rowflex">
            <span style="font-size:14px;">${fmtKoDate(b.datetime)} ${fmtKoTime(b.datetime)} · ${b.duration}분</span>
            <button class="btn ghost sm" ${BUSY ? 'disabled' : ''} onclick="studentCancel('${token}','${b.id}')">${cancellable ? '취소' : '취소 (횟수 복구 안됨)'}</button>
          </div>
          <a class="link" style="display:inline-block;margin-top:6px;" target="_blank" rel="noopener noreferrer" href="${gcalLink(b.datetime, b.duration, '모모 일본어 레슨')}">캘린더에 추가</a>
        </div>`;
    });
  }

  html += `<div class="section-label"><span class="eng" style="font-size:19px;">AVAILABLE TIMES</span><span class="jp-sub">예약 가능한 시간</span></div>`;
  if (student.balance <= 0) {
    html += `<div class="card" style="border-color:var(--ink);"><span style="font-size:13.5px;color:var(--ink);">잔여 횟수가 없어요. 선생님께 문의해 주세요.</span></div>`;
  }
  if (bookableStarts.length === 0 && student.balance > 0) {
    html += `<div class="card"><span class="muted">현재 열려있는 시간이 없어요.</span></div>`;
  }

  const byDate = {};
  bookableStarts.forEach((s) => {
    const dk = dateKey(s.datetime);
    (byDate[dk] = byDate[dk] || []).push(s);
  });
  const dks = Object.keys(byDate).sort();
  if (dks.length > 0) {
    const first = new Date(dks[0] + 'T00:00:00');
    const last = new Date(dks[dks.length - 1] + 'T00:00:00');
    let y = first.getFullYear(), m = first.getMonth();
    const endY = last.getFullYear(), endM = last.getMonth();
    while (y < endY || (y === endY && m <= endM)) {
      html += renderMonthCalendar(y, m, byDate, token);
      m++; if (m > 11) { m = 0; y++; }
    }
  }

  html += timeModalHtml(token, byDate, policy, student.balance);

  html += `
    <svg class="lattice" width="72" height="24" viewBox="0 0 72 24" fill="none">
      <path d="M0 12h72M12 0v24M24 0v24M36 0v24M48 0v24M60 0v24" stroke="var(--ink-12)" stroke-width="1"/>
    </svg>
    <div class="brand-block">
      <div class="brand-mark">MOMO<br>일본어</div>
      <div class="brand-name">모모 일본어 교실</div>
      <div class="brand-eng">MOMO JAPANESE</div>
    </div>`;

  document.getElementById('app').innerHTML = html;
}

function dateKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function renderMonthCalendar(year, month, byDate, token) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startOffset = new Date(year, month, 1).getDay();
  const weekdays = ['일','월','화','수','목','금','토'];
  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (byDate[dk] && byDate[dk].length > 0) {
      cells += `<div class="cal-cell available" onclick="openTimeModal('${token}','${dk}')">${d}<span class="cal-dot"></span></div>`;
    } else {
      cells += `<div class="cal-cell">${d}</div>`;
    }
  }
  return `
    <div class="card">
      <div style="font-size:13px;font-weight:600;color:var(--ink);margin-bottom:10px;">${year}. ${month+1}</div>

function timeModalHtml(token, byDate, policy, balance) {
  if (!MODAL_DATE) return '';
  const items = (byDate[MODAL_DATE] || []).slice().sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
  if (items.length === 0) return '';
  const hours = [...new Set(items.map((s) => new Date(s.datetime).getHours()))].sort((a,b) => a-b);
  const cols = ['00','15','30','45'];
  const dateLabel = fmtKoDate(items[0].datetime);
  let rows = '';
  hours.forEach((h) => {
    rows += `<tr><td class="time-grid-hour">${String(h).padStart(2,'0')}</td>`;
    cols.forEach((mm) => {
      const match = items.find((s) => {
        const d = new Date(s.datetime);
        return d.getHours() === h && d.getMinutes() === Number(mm);
      });
      if (!match) { rows += `<td></td>`; return; }
      const bookable = new Date() < deadlineFor(match.datetime, policy.bookDaysBefore, policy.bookCutoffHour);
      if (bookable) {
        const label = `${dateLabel} ${String(h).padStart(2,'0')}:${mm}`;
        rows += `<td><button class="time-cell" ${BUSY || balance<=0 ? 'disabled' : ''} onclick="confirmBook('${token}','${match.id}','${label}')">${mm}</button></td>`;
      } else {
        rows += `<td><span class="time-cell closed">마감</span></td>`;
      }
    });
    rows += `</tr>`;
  });
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeTimeModal('${token}')">
      <div class="modal-box">
        <div class="modal-title">${dateLabel}</div>
        <table class="time-grid"><tbody>${rows}</tbody></table>
        <button class="btn ghost sm" style="margin-top:14px;width:100%;" onclick="closeTimeModal('${token}')">닫기</button>
      </div>
    </div>`;
}

function openTimeModal(token, dk) { MODAL_DATE = dk; renderStudentView(token); }
function closeTimeModal(token) { MODAL_DATE = null; renderStudentView(token); }

async function confirmBook(token, slotId, label) {

}

async function studentBook(token, slotId) {
  if (BUSY) return;
  BUSY = true; renderStudentView(token);
  const res = await apiPost('book', { studentToken: token, startSlotId: slotId });
  if (res.ok) { DATA = res.state; MSG = '예약이 완료됐어요.'; }
  else {
    const msgs = { pastDeadline: '이 시간은 예약 가능 기한이 지났어요.', noBalance: '잔여 횟수가 없어요.', slotUnavailable: '이미 예약된 시간이에요.', noConsecutiveSlot: '연속된 시간이 방금 예약돼서 예약할 수 없어요.' };
    MSG = msgs[res.error] || '예약에 실패했어요.';
  }
  BUSY = false; renderStudentView(token);
}
async function studentCancel(token, bookingId) {
  if (BUSY) return;
  const booking = DATA.bookings.find((b) => b.id === bookingId);
  const policy = DATA.policy;
  const cancellable = new Date() < deadlineFor(booking.datetime, policy.cancelDaysBefore, policy.cancelCutoffHour);
  const msg = cancellable ? '이 예약을 취소할까요? 취소하면 잔여 횟수가 복구돼요.' : '취소 기한이 지나서 잔여 횟수는 복구되지 않아요. 그래도 취소하시겠어요?';
  if (!confirm(msg)) return;
  BUSY = true; renderStudentView(token);
  const res = await apiPost('cancelBooking', { bookingId, isAdmin: false });
  if (res.ok) { DATA = res.state; MSG = res.cancellable ? '예약을 취소했어요.' : '취소됐어요. (횟수는 복구되지 않아요)'; }
  else MSG = '취소에 실패했어요.';
  BUSY = false; renderStudentView(token);
}

async function addSlotRange() {
  const date = document.getElementById('slotDate').value;
  const sh = document.getElementById('startHour').value, sm = document.getElementById('startMin').value;
  const eh = document.getElementById('endHour').value, em = document.getElementById('endMin').value;
  if (!date) return alert('日付を入力してください');
  const startIso = combineDateTime(date, sh, sm);
  let endDate = date;
  if (eh === '24') {
    const d = new Date(`${date}T00:00:00`); d.setDate(d.getDate()+1);
    endDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  const endIso = combineDateTime(endDate, eh === '24' ? '0' : eh, em);
  if (new Date(endIso) <= new Date(startIso)) return alert('終了時刻は開始時刻より後にしてください');
  const res = await apiPost('addSlotRange', { startIso, endIso });
  if (res.ok) { DATA = res.state; renderTabBody(); alert(`${res.count}件の枠（15分刻み）を追加しました`); }
  else alert('追加に失敗しました');
}

async function addManualBooking() {

  const payload = { mode, datetimeIso, duration };
  if (mode === 'trial') {
    const guestName = document.getElementById('guestName').value.trim();
    if (!guestName) return alert('名前を入力してください');
    payload.guestName = guestName;
  } else {
    payload.studentId = document.getElementById('manualStudent').value;
    if (!payload.studentId) return alert('生徒を選んでください');
  }
  const res = await apiPost('addManualBooking', payload);
  if (res.ok) { DATA = res.state; renderTabBody(); alert('予約を追加しました。'); }
  else alert('追加に失敗しました');
}
async function adminCancelBooking(bookingId) {
  if (!confirm('この予約をキャンセルしますか？')) return;
  const res = await apiPost('cancelBooking', { bookingId, isAdmin: true });
  if (res.ok) { DATA = res.state; renderTabBody(); }
}

/* ---- 設定タブ ---- */
let SETTINGS_EDIT = { pin: false, policy: false };
/* ---- カレンダータブ ---- */
function calendarTabHtml() {
  const now = new Date();
  const view = CAL_VIEW || { year: now.getFullYear(), month: now.getMonth() };
  const byDate = {};
  DATA.bookings.filter((b) => b.status !== 'cancelled' && b.status !== 'cancelled_late').forEach((b) => {
    const dk = dateKey(b.datetime);
    (byDate[dk] = byDate[dk] || []).push(b);
  });
  const daysInMonth = new Date(view.year, view.month + 1, 0).getDate();
  const startOffset = new Date(view.year, view.month, 1).getDay();
  const weekdays = ['日','月','火','水','木','金','土'];
  let cells = '';
  for (let i = 0; i < startOffset; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dk = `${view.year}-${String(view.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if (byDate[dk] && byDate[dk].length > 0) {
      cells += `<div class="cal-cell available" onclick="openCalDay('${dk}')">${d}<span class="cal-dot"></span></div>`;
    } else {
      cells += `<div class="cal-cell">${d}</div>`;
    }
  }
  let html = `
    <div class="card">
      <div class="rowflex" style="margin-bottom:10px;">
        <button class="btn ghost sm" onclick="calNav(-1)">←</button>
        <div style="font-size:14px;font-weight:600;">${view.year}. ${view.month+1}</div>
        <button class="btn ghost sm" onclick="calNav(1)">→</button>
      </div>
      <div class="cal-grid">${weekdays.map((w) => `<div class="cal-wd">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
    </div>`;
  if (CAL_DAY) html += calDayPanelHtml(byDate);
  return html;
}
function calNav(delta) {
  const now = new Date();
  const view = CAL_VIEW || { year: now.getFullYear(), month: now.getMonth() };
  let m = view.month + delta, y = view.year;
  if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
  CAL_VIEW = { year: y, month: m };
  CAL_DAY = null;
  renderTabBody();
}
function openCalDay(dk) { CAL_DAY = dk; renderTabBody(); }
function closeCalDay() { CAL_DAY = null; renderTabBody(); }
function calDayPanelHtml(byDate) {
  const items = (byDate[CAL_DAY] || []).slice().sort((a,b) => new Date(a.datetime) - new Date(b.datetime));
  const studentById = {}; DATA.students.forEach((s) => studentById[s.id] = s);
  let rows = '';
  items.forEach((b) => {
    const name = b.type === 'trial' ? `${esc(b.guestName)}（体験）` : (studentById[b.studentId] ? esc(studentById[b.studentId].name) : '（削除済み）');
    const jumpBtn = (b.type !== 'trial' && studentById[b.studentId]) ? `<button class="btn ghost sm" onclick="jumpToStudent('${b.studentId}')">生徒を編集</button>` : '';
    rows += `<div class="card"><div style="font-size:14px;">${fmtJaTime(b.datetime)} · ${b.duration}分 · ${name}</div>${jumpBtn ? `<div style="margin-top:6px;">${jumpBtn}</div>` : ''}</div>`;
  });
  const label = items.length ? fmtJaDate(items[0].datetime) : CAL_DAY;
  return `<div class="section-label">${label}の予約</div>${rows}<button class="btn ghost sm" onclick="closeCalDay()">閉じる</button>`;
}
function jumpToStudent(studentId) {
  TAB = 'students';
  CAL_DAY = null;
  renderTabBody();
  const s = DATA.students.find((x) => x.id === studentId);
  if (s && s.active) toggleEdit(studentId);
}
function settingsTabHtml() {
  const p = DATA.policy;
  let html = `<div class="card">
      <div class="serif" style="font-size:15px;margin-bottom:10px;color:var(--ink);">管理PINの変更</div>`;
  if (!SETTINGS_EDIT.pin) {
    html += `<button class="btn ghost sm" onclick="SETTINGS_EDIT.pin=true;renderTabBody();">編集する</button>`;
  } else {
    html += `
      <div class="field"><div class="field-label">新しいPIN</div><input id="newPin"></div>
      <button class="btn" onclick="changePin()">変更する</button>
      <button class="btn ghost sm" style="margin-left:6px;" onclick="SETTINGS_EDIT.pin=false;renderTabBody();">閉じる</button>`;
  }
  html += `</div>
    <div class="card">
      <div class="serif" style="font-size:15px;margin-bottom:10px;color:var(--ink);">キャンセル・予約期限</div>`;
  if (!SETTINGS_EDIT.policy) {
    html += `
      <div class="muted" style="font-size:12.5px;margin-bottom:10px;">レッスンの${p.cancelDaysBefore}日前${p.cancelCutoffHour}時までキャンセル可／${p.bookDaysBefore}日前${p.bookCutoffHour}時まで新規予約可</div>
      <button class="btn ghost sm" onclick="SETTINGS_EDIT.policy=true;renderTabBody();">編集する</button>`;
  } else {
    html += `
      <div class="field"><div class="field-label">キャンセル・変更期限（レッスン何日前まで）</div><input type="number" min="0" id="cancelDaysBefore" value="${p.cancelDaysBefore}"></div>
      <div class="field"><div class="field-label">キャンセル期限の時刻（時）</div><input type="number" min="0" max="23" id="cancelCutoffHour" value="${p.cancelCutoffHour}"></div>
      <div class="field"><div class="field-label">新規予約の締切（レッスン何日前まで）</div><input type="number" min="0" id="bookDaysBefore" value="${p.bookDaysBefore}"></div>
      <div class="field"><div class="field-label">予約締切の時刻（時）</div><input type="number" min="0" max="23" id="bookCutoffHour" value="${p.bookCutoffHour}"></div>
      <button class="btn" onclick="updateSettings()">保存する</button>
      <button class="btn ghost sm" style="margin-left:6px;" onclick="SETTINGS_EDIT.policy=false;renderTabBody();">閉じる</button>`;
  }
  html += `</div>
    <div class="card" style="border-color:var(--ink);">
      <div class="serif" style="font-size:15px;margin-bottom:6px;color:var(--ink);">テストデータをリセット</div>
      <div class="muted" style="font-size:12px;margin-bottom:10px;">生徒・空き枠・予約をすべて削除して空の状態に戻します（PINと期限設定はそのまま残ります）。本番の生徒を登録する前のテスト用です。</div>
      <button class="btn rust" onclick="resetAllData()">全データをリセット</button>
    </div>`;
  return html;
}
async function changePin() {
  const newPin = document.getElementById('newPin').value;
  if (!newPin) return;
  const res = await apiPost('changePin', { newPin });
  if (res.ok) { SETTINGS_EDIT.pin = false; renderTabBody(); alert('PINを変更しました'); }
}
async function updateSettings() {
  const payload = {
    cancelDaysBefore: document.getElementById('cancelDaysBefore').value,
    cancelCutoffHour: document.getElementById('cancelCutoffHour').value,
    bookDaysBefore: document.getElementById('bookDaysBefore').value,
    bookCutoffHour: document.getElementById('bookCutoffHour').value,
  };
  const res = await apiPost('updateSettings', payload);
  if (res.ok) { DATA = res.state; SETTINGS_EDIT.policy = false; renderTabBody(); alert('期限を変更しました'); }
}
async function resetAllData() {
  if (!confirm('生徒・空き枠・予約をすべて削除します。よろしいですか？')) return;
  if (!confirm('本当に元に戻せません。実行しますか？')) return;
  const res = await apiPost('resetData', {});
  if (res.ok) { DATA = res.state; renderTabBody(); alert('リセットしました'); }
}

/* ===================== 起動 ===================== */
/* ===================== 写真の自動読み込み（拡張子を自動判定） ===================== */
(function () {
  var PHOTO_EXTS = ['jpg', 'jpeg', 'png', 'JPG', 'JPEG', 'PNG', 'webp', 'WEBP', 'heic', 'HEIC', 'jfif', 'JFIF'];
  document.querySelectorAll('.auto-photo').forEach(function (img) {
    var base = img.getAttribute('data-base');
    var idx = 0;
    function tryNext() {
      if (idx >= PHOTO_EXTS.length) { img.closest('.photo-hero').style.display = 'none'; return; }
      img.src = base + '.' + PHOTO_EXTS[idx];
      idx++;
    }
    img.addEventListener('error', tryNext);
    tryNext();
  });
})();

boot();
